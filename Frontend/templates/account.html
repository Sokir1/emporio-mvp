<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main>
 <div class="page-heading"><div><span class="eyebrow">TU ACCESO AL NEGOCIO</span><h1>Mi cuenta</h1><p th:text="${userDisplay}"></p></div></div>
 <form class="card form-card compact" th:action="@{/mi-cuenta/clave}" method="post"><h2>Cambiar contraseña</h2><label for="currentPassword">Contraseña actual</label><input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"><label for="newPassword">Nueva contraseña</label><input id="newPassword" name="newPassword" type="password" minlength="10" maxlength="72" required autocomplete="new-password"><label for="confirmation">Confirmar nueva contraseña</label><input id="confirmation" name="confirmation" type="password" minlength="10" maxlength="72" required autocomplete="new-password"><p class="muted">Usa al menos 10 caracteres. Después del cambio tendrás que ingresar nuevamente.</p><div class="form-actions"><button class="btn primary" type="submit">Actualizar contraseña</button></div></form>
</main></html>
