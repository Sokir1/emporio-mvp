<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main>
 <div class="page-heading"><div><a th:href="@{/ventas}" class="text-link">← Volver a ventas</a><h1>Registrar una venta</h1><p>Elige el producto, escribe la cantidad y confirma la venta.</p></div></div>
 <form th:action="@{/ventas/nueva}" method="post" class="card form-card wide" id="sale-form"><input type="hidden" name="saleToken" th:value="${saleToken}"><div class="form-grid"><div><label for="locationId">Lugar de la mercadería <span>*</span></label><select id="locationId" name="locationId" required><option value="">¿De dónde sacarás el producto?</option><option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name}"></option></select></div><div><label for="payment">Medio de pago <span>*</span></label><select id="payment" name="payment"><option value="EFECTIVO">Efectivo</option><option value="TARJETA">Tarjeta</option><option value="TRANSFERENCIA">Transferencia</option></select></div></div>
 <div class="notice info">Elige el lugar de donde sacarás la mercadería. Solo se venden productos disponibles y sin vencer.</div>
 <div id="sale-rows"><div class="sale-row"><div class="sale-product"><label for="sale-product-1">Producto</label><select id="sale-product-1" name="productIds" required class="sale-product-select"><option value="">Seleccionar producto</option><option th:each="r : ${products}" th:value="${r.product.id}" th:attr="data-price=${r.product.salePrice},data-unit=${r.product.unit}" th:text="${r.product.name + ' · Disponible: ' + format.qty(r.available) + ' ' + r.product.unit}"></option></select></div><div><label for="sale-quantity-1">Cantidad</label><input id="sale-quantity-1" name="quantities" type="number" min="0.001" step="0.001" max="999999999.999" required value="1" class="sale-quantity"><small class="quantity-hint"></small></div><div class="line-price"><span class="muted">Subtotal</span><strong class="sale-subtotal">$0</strong></div><button class="btn icon-btn remove-row" type="button" title="Quitar producto" aria-label="Quitar producto">×</button></div></div>
 <button class="btn secondary" type="button" id="add-sale-row">＋ Agregar otro producto</button><div class="sale-total"><span>Total a pagar</span><strong id="sale-total" aria-live="polite">$0</strong></div><div class="form-actions"><a class="btn secondary" th:href="@{/ventas}">Cancelar</a><button class="btn primary" type="submit" th:disabled="${#lists.isEmpty(products) or #lists.isEmpty(locations)}">Confirmar venta</button></div></form>
</main></html>
