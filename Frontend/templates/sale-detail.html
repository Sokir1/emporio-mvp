<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: page(~{::main})}"><main>
 <div class="page-heading"><div><a class="text-link" th:href="@{/ventas}">← Ventas</a><h1 th:text="${'Venta #'+sale.id}"></h1><p th:text="${format.time(sale.createdAt)+' · '+sale.actor+' · '+sale.paymentMethod}"></p></div><span class="badge" th:classappend="${sale.cancelled} ? 'red' : 'mint'" th:text="${sale.cancelled ? 'Anulada' : 'Registrada'}"></span></div>
 <div class="notice danger" th:if="${sale.cancelled}"><strong>Venta anulada.</strong><p th:text="${sale.cancellationReason}"></p></div>
 <section class="card"><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Lote utilizado</th><th>Ubicación</th><th class="numeric">Cantidad</th><th class="numeric">Precio</th><th class="numeric">Subtotal</th></tr></thead><tbody><tr th:each="l : ${lines}"><td><a class="product-name" th:href="@{/productos/{id}(id=${l.lot.product.id})}" th:text="${l.lot.product.name}"></a></td><td th:text="${l.lot.code}"></td><td th:text="${l.lot.location.name}"></td><td class="numeric" th:text="${format.qty(l.quantity)+' '+l.lot.product.unit}"></td><td class="numeric" th:text="${format.money(l.unitPrice)}"></td><td class="numeric" th:text="${format.money(l.subtotal)}"></td></tr></tbody></table></div><div class="sale-total"><span>Total registrado</span><strong th:text="${format.money(sale.total)}"></strong></div><div class="card-note">Registro interno. Si un producto usa varios lotes, aparece una línea por cada lote consumido.</div></section>
 <form sec:authorize="hasRole('ADMIN')" th:if="${!sale.cancelled}" class="card form-card compact" th:action="@{/ventas/{id}/anular(id=${sale.id})}" method="post"><h2>Anular esta venta</h2><p class="muted">Úsalo cuando corresponde devolver todas las cantidades al inventario.</p><label for="reason">Motivo de anulación</label><input id="reason" name="reason" required maxlength="250" placeholder="Ej. Error en el registro"><button class="btn danger-btn" type="submit">Anular y restituir stock</button></form>
</main></html>
