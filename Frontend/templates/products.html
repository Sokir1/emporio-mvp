<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: page(~{::main})}"><main>
 <div class="page-heading"><div><span class="eyebrow">TU CATÁLOGO, EN UN SOLO LUGAR</span><h1>Productos</h1><p>Encuentra un producto y conoce sus existencias y ubicación.</p></div><div class="actions"><a class="btn secondary" th:href="@{/reportes/inventario.csv}">↓ Exportar CSV</a><a sec:authorize="hasRole('ADMIN')" class="btn primary" th:href="@{/productos/nuevo}">＋ Nuevo producto</a></div></div>
 <section class="card"><form class="filter-bar" th:action="@{/productos}" method="get"><div class="search-field"><label class="sr-only" for="q">Buscar producto o ubicación</label><input id="q" name="q" th:value="${q}" placeholder="Buscar por nombre, código o ubicación…" type="search"></div><label class="sr-only" for="category">Categoría</label><select id="category" name="category"><option value="">Todas las categorías</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option></select><label class="sr-only" for="status">Estado de stock</label><select id="status" name="status"><option value="">Todos los niveles</option><option value="BAJO" th:selected="${status == 'BAJO'}">Stock bajo</option><option value="AGOTADO" th:selected="${status == 'AGOTADO'}">Agotados</option><option value="NORMAL" th:selected="${status == 'NORMAL'}">Stock normal</option><option value="ARCHIVADO" th:selected="${status == 'ARCHIVADO'}">Archivados</option></select><button class="btn secondary">Buscar</button><a th:href="@{/productos}" class="text-link">Limpiar</a></form>
 <div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="numeric">Disponible</th><th>Nivel</th><th>Ubicaciones</th><th class="numeric">Precio de venta</th><th></th></tr></thead><tbody><tr th:each="r : ${rows}"><td><a class="product-name" th:href="@{/productos/{id}(id=${r.product.id})}" th:text="${r.product.name}"></a><small th:text="${r.product.sku}"></small></td><td th:text="${r.product.category}"></td><td class="numeric"><strong th:text="${format.qty(r.available) + ' ' + r.product.unit}"></strong><small th:if="${r.physical != r.available}" th:text="${'Físico: ' + format.qty(r.physical)}"></small></td><td><span class="badge" th:classappend="${r.status == 'AGOTADO' ? 'red' : r.status == 'BAJO' ? 'yellow' : 'mint'}" th:text="${r.status == 'NORMAL' ? 'En stock' : r.status == 'BAJO' ? 'Stock bajo' : 'Agotado'}"></span></td><td class="location-cell" th:text="${r.places.isBlank() ? 'Sin existencias' : r.places}"></td><td class="numeric" th:text="${format.money(r.product.salePrice) + ' / ' + r.product.unit}"></td><td><a class="table-link" th:href="@{/productos/{id}(id=${r.product.id})}" aria-label="Ver producto">→</a></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="7" class="empty-cell">No hay productos que coincidan con esta búsqueda.</td></tr></tbody></table></div><div class="card-note" th:text="${#lists.size(rows) + ' producto(s) · El disponible excluye lotes vencidos y retenidos.'}"></div>
 </section>
</main></html>
