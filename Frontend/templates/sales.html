<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main>
 <div class="page-heading"><div><span class="eyebrow">VENTAS QUE ACTUALIZAN TU STOCK</span><h1>Ventas</h1><p>Cada venta descuenta los lotes más próximos a vencer.</p></div><a class="btn primary" th:href="@{/ventas/nueva}">＋ Nueva venta</a></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Venta</th><th>Fecha</th><th>Responsable</th><th>Medio de pago</th><th>Estado</th><th class="numeric">Total</th><th></th></tr></thead><tbody><tr th:each="s : ${sales}"><td><a class="product-name" th:href="@{/ventas/{id}(id=${s.id})}" th:text="${'#'+s.id}"></a></td><td th:text="${format.time(s.createdAt)}"></td><td th:text="${s.actor}"></td><td th:text="${s.paymentMethod}"></td><td><span class="badge" th:classappend="${s.cancelled} ? 'red' : 'mint'" th:text="${s.cancelled ? 'Anulada' : 'Registrada'}"></span></td><td class="numeric" th:text="${format.money(s.total)}"></td><td><a class="table-link" th:href="@{/ventas/{id}(id=${s.id})}">→</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="7" class="empty-cell">Todavía no hay ventas. Registra la primera venta para comenzar.</td></tr></tbody></table></div><div class="card-note">Últimas 100 ventas · Registro interno de ventas.</div></section>
</main></html>
