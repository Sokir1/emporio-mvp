spring.application.name=emporio
server.address=${APP_HOST:127.0.0.1}
server.port=${APP_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3307/emporio}
spring.datasource.username=${DB_USER:emporio_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.flyway.enabled=true
spring.thymeleaf.cache=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.format.date=yyyy-MM-dd
emporio.admin.username=${ADMIN_USERNAME:admin}
emporio.admin.password=${ADMIN_PASSWORD:}
logging.level.org.hibernate.orm.deprecation=ERROR
